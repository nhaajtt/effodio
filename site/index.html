<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpie: describe it, find it</title>
<meta name="description" content="Magpie searches the files on your Windows PC by what's in them: photos, PDFs, documents, recordings and videos. Everything runs on your computer.">
<meta property="og:title" content="Magpie: describe it, find it">
<meta property="og:description" content="Search your own files by what's in them. Private, on your PC.">
<meta property="og:image" content="https://magpie.nhaajt.com/icon.png">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="icon.png">
<link rel="preload" href="fonts/Geist-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/site-data.js">
<link rel="modulepreload" href="js/frame.js">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/backdrop.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/grid.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="g-sky" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="lab-body">
  <header class="hdr" id="hdr-mount"><a class="g-brand" href="#"><img src="icon.png" alt="" width="24" height="24"><span>Magpie</span></a></header>
  <div class="lab-shell">
    <section class="lab-intro" id="intro-mount"></section>
    <!-- The install line is written here, not built by a script: it's there whatever else loads or doesn't. -->
    <div class="g-top g-top-static" id="top-install">
      <div class="g-cmd"><span aria-hidden="true">PS&gt;</span><code>powershell -c "irm https://magpie.nhaajt.com/install.ps1 | iex"</code><button type="button">Copy</button></div>
      <a class="g-top-link" href="download/Magpie___VERSION___x64-setup.exe"><span data-label>Download .exe</span> <span aria-hidden="true">↓</span></a>
    </div>

    <div class="lab-desk-stage" id="desk-stage">
      <figure class="g-device">
        <figcaption><i></i><i></i><i></i><span id="screen-note"></span><b>● REC</b></figcaption>
        <video src="demo.mp4" poster="demo.jpg" muted loop playsinline autoplay preload="metadata"></video>
      </figure>
    </div>

    <div class="lab-timeline" id="timeline-mount"></div>
    <main class="lab-grid" id="main-content"></main>

    <section class="g-band" id="private">
      <p class="g-kicker" id="private-kicker"></p>
      <p class="lab-intro-lede" id="private-text"></p>
    </section>

    <section class="g-band" id="install">
      <p class="g-kicker" id="install-kicker"></p>
      <h2 class="g-title" id="install-title"></h2>
      <div class="g-cmd">
        <span aria-hidden="true">PS&gt;</span>
        <code id="cmdtext"></code>
        <button id="copy" type="button"></button>
      </div>
      <div class="g-two">
        <p><span id="one"></span> <a href="install.ps1" id="read"></a></p>
        <p><span id="two"></span> <a id="exe" href="download/Magpie___VERSION___x64-setup.exe">Magpie___VERSION___x64-setup.exe</a></p>
      </div>
      <p class="g-fine">SHA-256 <code>__SHA256__</code></p>
      <p class="g-fine" id="ffmpeg"></p>
    </section>

    <section class="g-band" id="feedback">
      <p class="g-kicker" id="fb-kicker"></p>
      <h2 class="g-title" id="fb-title"></h2>
      <form class="g-form" id="fb-form">
        <textarea id="fb-text" maxlength="4000" rows="5" required></textarea>
        <input id="fb-contact" type="text" maxlength="200" autocomplete="off">
        <div class="g-form-row"><button type="submit" id="fb-send"></button><span class="g-fine" id="fb-note"></span></div>
      </form>
    </section>

    <footer class="g-foot">
      <p id="thanks"></p>
      <p class="g-kicker">© 2026 Nhaajt · v__VERSION__</p>
    </footer>
  </div>
</div>
<div id="cursor-mount"></div>
<script type="module" src="js/header.js"></script>
<script type="module" src="js/backdrop.js"></script>
<script type="module" src="js/timeline.js"></script>
<script type="module" src="js/grid.js"></script>
<script type="module" src="js/page.js"></script>
<script type="module" src="js/feedback.js"></script>
</body>
</html>
