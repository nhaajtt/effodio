[package]
name = "magpie-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Magpie's helper process: it runs the model, builds the index and answers searches"

[[bin]]
name = "magpie-helper"
path = "src/main.rs"

[dependencies]
magpie-core = { path = "../core" }
magpie-embed = { path = "../embed" }
magpie-faces = { path = "../faces" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
