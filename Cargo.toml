[workspace]
resolver = "2"
members = ["crates/embed", "crates/faces", "crates/core", "crates/helper", "app/src-tauri"]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
