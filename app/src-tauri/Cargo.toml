[package]
name = "magpie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Search the files on your computer by what's in them"

[[bin]]
name = "magpie"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magpie-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
notify = "6"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
blake3 = "1"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
] }
